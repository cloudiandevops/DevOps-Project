apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  labels:
    app: netflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-app
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
        - name: netflix-app
          image: 583365237888.dkr.ecr.ap-south-1.amazonaws.com/netflix-clone:master-06853aa39a738fa2d86f755e54c09b45ef585b65
          ports:
            - containerPort: 80
