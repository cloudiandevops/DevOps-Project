apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  labels:
    app: netflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-app
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
        - name: netflix-app
          image: 583365237888.dkr.ecr.ap-south-1.amazonaws.com/netflix-clone:master-d66d304605ff48dc321c210766a2cc05c4d8852b
          ports:
            - containerPort: 80
